services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: alveo
      POSTGRES_PASSWORD: alveo
      POSTGRES_DB: alveo
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alveo -d alveo']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
